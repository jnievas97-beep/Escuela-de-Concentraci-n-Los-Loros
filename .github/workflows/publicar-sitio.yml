name: Publicar sitio, comunicados, noticias y avisos

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # Regenera el sitio todos los días para activar o vencer avisos
  # aunque nadie haga un nuevo push al repositorio.
  schedule:
    - cron: "10 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar soporte para vistas previas PDF
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generar listas automáticas de comunicados, noticias y avisos
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import quote

          def fecha_git(archivo):
              try:
                  resultado = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cI",
                          "--",
                          str(archivo)
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

                  return resultado.stdout.strip()

              except Exception:
                  return ""


          # ===============================================
          # COMUNICADOS
          # ===============================================

          carpeta_comunicados = Path("comunicados")
          carpeta_comunicados.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_comunicado = re.compile(
              r"^COMUNICADO\s+(\d+)\.pdf$",
              re.IGNORECASE
          )

          comunicados = []

          for archivo in carpeta_comunicados.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_comunicado.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              comunicados.append({
                  "numero": numero,
                  "nombre": archivo.name,
                  "ruta": (
                      "comunicados/" +
                      quote(
                          archivo.name,
                          safe=""
                      )
                  ),
                  "fecha": fecha_git(
                      archivo
                  )
              })

          comunicados.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          salida_comunicados = (
              carpeta_comunicados /
              "comunicados.json"
          )

          salida_comunicados.write_text(
              json.dumps(
                  comunicados,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ===============================================
          # NOTICIAS
          #
          # Formatos:
          # noticias01.jpg
          # noticias02.jpeg
          # noticias03.png
          # noticias04.pdf
          # ===============================================

          carpeta_noticias = Path("noticias")
          carpeta_noticias.mkdir(
              parents=True,
              exist_ok=True
          )

          carpeta_previews = (
              carpeta_noticias /
              "previews"
          )

          if carpeta_previews.exists():
              shutil.rmtree(
                  carpeta_previews
              )

          carpeta_previews.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_noticia = re.compile(
              r"^noticias(\d+)\.(pdf|png|jpe?g)$",
              re.IGNORECASE
          )

          noticias = []

          for archivo in carpeta_noticias.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_noticia.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              extension = (
                  coincidencia.group(2)
                  .lower()
              )


              ruta_original = (
                  "noticias/" +
                  quote(
                      archivo.name,
                      safe=""
                  )
              )

              if extension == "pdf":

                  destino_pdf = (
                      carpeta_previews /
                      f"noticias{numero:02d}"
                  )

                  destino_pdf.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  prefijo = (
                      destino_pdf /
                      "pagina"
                  )

                  subprocess.run(
                      [
                          "pdftoppm",
                          "-png",
                          "-r",
                          "140",
                          str(archivo),
                          str(prefijo)
                      ],
                      check=True
                  )

                  paginas_locales = sorted(
                      destino_pdf.glob(
                          "pagina-*.png"
                      )
                  )

                  paginas = [
                      (
                          "noticias/previews/" +
                          f"noticias{numero:02d}/" +
                          pagina.name
                      )
                      for pagina in paginas_locales
                  ]

                  noticias.append({
                      "numero": numero,
                      "nombre": archivo.name,
                      "tipo": "pdf",
                      "ruta": ruta_original,
                      "paginas": paginas,
                      "fecha": fecha_git(
                          archivo
                      )
                  })

              else:

                  noticias.append({
                      "numero": numero,
                      "nombre": archivo.name,
                      "tipo": "imagen",
                      "ruta": ruta_original,
                      "paginas": [],
                      "fecha": fecha_git(
                          archivo
                      )
                  })

          noticias.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          salida_noticias = (
              carpeta_noticias /
              "noticias.json"
          )

          salida_noticias.write_text(
              json.dumps(
                  noticias,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )



          # ===============================================
          # DOCUMENTOS - LISTA AUTOMÁTICA MULTIFORMATO
          #
          # El navegador abrirá directamente los formatos
          # que soporte y descargará/derivará al sistema
          # los demás (por ejemplo DOCX o PPTX).
          # ===============================================

          carpeta_documentos = Path("documentos")
          carpeta_documentos.mkdir(
              parents=True,
              exist_ok=True
          )

          documentos_auto = []

          for archivo in carpeta_documentos.iterdir():

              if not archivo.is_file():
                  continue

              if archivo.name.lower() == "documentos.json":
                  continue

              extension = (
                  archivo.suffix
                  .lower()
                  .lstrip(".")
              )

              if not extension:
                  continue

              documentos_auto.append({
                  "nombre": archivo.name,
                  "ruta": (
                      "documentos/" +
                      quote(
                          archivo.name,
                          safe=""
                      )
                  ),
                  "extension": extension,
                  "fecha": fecha_git(
                      archivo
                  )
              })

          documentos_auto.sort(
              key=lambda item: item["nombre"].lower()
          )

          (
              carpeta_documentos /
              "documentos.json"
          ).write_text(
              json.dumps(
                  documentos_auto,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # ===============================================
          # SEGURIDAD - GALERÍA AUTOMÁTICA DE IMÁGENES
          #
          # Formatos admitidos:
          # .jpg .jpeg .png .webp .gif .svg
          # ===============================================

          carpeta_seguridad = Path("seguridad")
          carpeta_seguridad.mkdir(
              parents=True,
              exist_ok=True
          )

          extensiones_seguridad = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
              ".svg"
          }

          imagenes_seguridad = []

          for archivo in carpeta_seguridad.iterdir():

              if not archivo.is_file():
                  continue

              if archivo.suffix.lower() not in extensiones_seguridad:
                  continue

              imagenes_seguridad.append({
                  "nombre": archivo.name,
                  "ruta": (
                      "seguridad/" +
                      quote(
                          archivo.name,
                          safe=""
                      )
                  ),
                  "fecha": fecha_git(
                      archivo
                  )
              })

          imagenes_seguridad.sort(
              key=lambda item: item["nombre"].lower()
          )

          (
              carpeta_seguridad /
              "seguridad.json"
          ).write_text(
              json.dumps(
                  imagenes_seguridad,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ===============================================
          # HORARIOS - METADATOS PARA FECHA Y ETIQUETA NUEVO
          # ===============================================

          carpeta_horarios = Path("horarios")
          carpeta_horarios.mkdir(parents=True, exist_ok=True)

          horarios_meta = []

          for archivo in carpeta_horarios.iterdir():
              if not archivo.is_file():
                  continue
              if archivo.suffix.lower() not in {
                  ".pdf", ".png", ".jpg", ".jpeg",
                  ".doc", ".docx", ".ppt", ".pptx"
              }:
                  continue
              horarios_meta.append({
                  "nombre": archivo.name,
                  "ruta": "horarios/" + quote(archivo.name, safe=""),
                  "fecha": fecha_git(archivo)
              })

          horarios_meta.sort(
              key=lambda item: item["nombre"].lower()
          )

          (carpeta_horarios / "horarios.json").write_text(
              json.dumps(
                  horarios_meta,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ===============================================
          # AVISOS
          #
          # Formatos admitidos:
          # aviso01.jpg
          # aviso02.jpeg
          # aviso03.png
          # aviso04.pdf
          # aviso05_hasta_2026-08-31.jpg
          # aviso06_desde_2026-08-24_hasta_2026-08-31.png
          #
          # El aviso con número más alto y fecha vigente se muestra primero.
          # ===============================================

          carpeta_avisos = Path("avisos")
          carpeta_avisos.mkdir(
              parents=True,
              exist_ok=True
          )

          carpeta_previews_avisos = (
              carpeta_avisos /
              "previews"
          )

          if carpeta_previews_avisos.exists():
              shutil.rmtree(
                  carpeta_previews_avisos
              )

          carpeta_previews_avisos.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_aviso = re.compile(
              r"^aviso\s*(\d+)(?:_desde_(\d{4}-\d{2}-\d{2}))?(?:_hasta_(\d{4}-\d{2}-\d{2}))?\.(pdf|png|jpe?g)$",
              re.IGNORECASE
          )

          avisos = []

          for archivo in carpeta_avisos.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_aviso.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              fecha_desde = coincidencia.group(2)
              fecha_hasta = coincidencia.group(3)

              extension = (
                  coincidencia.group(4)
                  .lower()
              )

              hoy = datetime.now(
                  ZoneInfo("America/Santiago")
              ).date()

              if fecha_desde:
                  if hoy < datetime.strptime(
                      fecha_desde,
                      "%Y-%m-%d"
                  ).date():
                      continue

              if fecha_hasta:
                  if hoy > datetime.strptime(
                      fecha_hasta,
                      "%Y-%m-%d"
                  ).date():
                      continue

              ruta_original = (
                  "avisos/" +
                  quote(
                      archivo.name,
                      safe=""
                  )
              )

              aviso = {
                  "numero": numero,
                  "nombre": archivo.name,
                  "titulo": f"Aviso N.º {numero}",
                  "texto": "",
                  "ruta": ruta_original,
                  "fecha": fecha_git(archivo),
                  "desde": fecha_desde or "",
                  "hasta": fecha_hasta or ""
              }

              if extension == "pdf":

                  prefijo_preview = (
                      carpeta_previews_avisos /
                      f"aviso{numero:02d}"
                  )

                  subprocess.run(
                      [
                          "pdftoppm",
                          "-png",
                          "-f",
                          "1",
                          "-singlefile",
                          "-r",
                          "140",
                          str(archivo),
                          str(prefijo_preview)
                      ],
                      check=True
                  )

                  aviso["tipo"] = "pdf"
                  aviso["preview"] = (
                      "avisos/previews/" +
                      f"aviso{numero:02d}.png"
                  )

              else:

                  aviso["tipo"] = "imagen"
                  aviso["preview"] = ""

              avisos.append(aviso)

          avisos.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          print(
              "Fecha usada para vigencia de avisos:",
              datetime.now(
                  ZoneInfo("America/Santiago")
              ).date().isoformat()
          )

          salida_avisos = (
              carpeta_avisos /
              "avisos.json"
          )

          salida_avisos.write_text(
              json.dumps(
                  avisos,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Comunicados encontrados:",
              len(comunicados)
          )

          print(
              "Noticias encontradas:",
              len(noticias)
          )

          print(
              "Avisos encontrados:",
              len(avisos)
          )

          if avisos:
              print(
                  "Aviso activo:",
                  avisos[0]["nombre"]
              )
          else:
              print(
                  "Aún no hay avisos disponibles."
              )

          if noticias:
              print(
                  "Última noticia:",
                  noticias[0]["nombre"]
              )
          else:
              print(
                  "Aún no hay noticias disponibles."
              )
          PY

      - name: Mostrar archivos generados
        shell: bash
        run: |
          echo "===== COMUNICADOS ====="
          cat comunicados/comunicados.json
          echo
          echo "===== NOTICIAS ====="
          cat noticias/noticias.json
          echo
          echo "===== SEGURIDAD ====="
          cat seguridad/seguridad.json
          echo
          echo "===== DOCUMENTOS ====="
          cat documentos/documentos.json
          echo
          echo "===== AVISOS ====="
          cat avisos/avisos.json
          echo
          echo "===== VISTAS PREVIAS DE AVISOS PDF ====="
          find avisos/previews -type f -maxdepth 2 -print || true
          echo
          echo "===== VISTAS PREVIAS DE PDF ====="
          find noticias/previews -type f -maxdepth 3 -print || true

      - name: Actualizar fecha visible del sitio
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          meses = [
              "",
              "enero",
              "febrero",
              "marzo",
              "abril",
              "mayo",
              "junio",
              "julio",
              "agosto",
              "septiembre",
              "octubre",
              "noviembre",
              "diciembre",
          ]

          ahora = datetime.now(ZoneInfo("America/Santiago"))
          fecha = (
              f"{ahora.day} de "
              f"{meses[ahora.month]} de "
              f"{ahora.year}"
          )

          archivo = Path("index.html")
          contenido = archivo.read_text(encoding="utf-8")
          contenido = contenido.replace(
              "FECHA_ACTUALIZACION_SITIO",
              fecha
          )
          archivo.write_text(
              contenido,
              encoding="utf-8"
          )

          print("Última actualización visible:", fecha)
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4


      # =====================================================
      # NOTIFICACIONES AUTOMÁTICAS
      # Comunicado · Noticias · Avisos importantes
      # Se ejecuta DESPUÉS de publicar correctamente el sitio.
      # =====================================================
      - name: Notificar archivos nuevos a los suscriptores
        if: github.event_name == 'push'
        shell: bash
        env:
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxrR_Gbk40Kn2Q2Kmg7Si9CZs184bVJ9bzMqCugiS8McOCA21bp3GXR0aJR4JTNMYWIWg/exec"
          NOTIFICACIONES_SECRET: ${{ secrets.NOTIFICACIONES_SECRET }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${NOTIFICACIONES_SECRET:-}" ]; then
            echo "ERROR: falta el Secret NOTIFICACIONES_SECRET en GitHub."
            exit 1
          fi

          echo "Buscando publicaciones nuevas..."

          # GitHub usa 40 ceros cuando no existe un commit anterior.
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "Primer push detectado. Se evita notificar archivos históricos."
            exit 0
          fi

          git diff --diff-filter=A --name-only "${BEFORE_SHA}" "${AFTER_SHA}" > /tmp/archivos_nuevos.txt

          if [ ! -s /tmp/archivos_nuevos.txt ]; then
            echo "No hay archivos nuevos. No se envían notificaciones."
            exit 0
          fi

          shopt -s nocasematch
          enviados=0

          while IFS= read -r archivo; do
            categoria=""

            if [[ "$archivo" =~ ^comunicados/COMUNICADO[[:space:]]+[0-9]+\.pdf$ ]]; then
              categoria="Comunicado"
            elif [[ "$archivo" =~ ^noticias/noticias[0-9]+\.(pdf|png|jpg|jpeg)$ ]]; then
              categoria="Noticias"
            elif [[ "$archivo" =~ ^avisos/aviso[[:space:]]*[0-9]+(_desde_[0-9]{4}-[0-9]{2}-[0-9]{2})?(_hasta_[0-9]{4}-[0-9]{2}-[0-9]{2})?\.(pdf|png|jpg|jpeg)$ ]]; then
              # Si el aviso tiene _desde_ en una fecha futura, no se notifica todavía.
              if [[ "$archivo" =~ _desde_([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
                fecha_desde="${BASH_REMATCH[1]}"
                hoy=$(TZ=America/Santiago date +%F)
                if [[ "$fecha_desde" > "$hoy" ]]; then
                  echo "Aviso programado para $fecha_desde: se notificará al comenzar su vigencia."
                  continue
                fi
              fi
              categoria="Avisos importantes"
            else
              continue
            fi

            evento="archivo:${archivo}"
            echo "Notificando: $categoria -> $archivo"

            curl --fail --silent --show-error --location \
              --request POST \
              --data-urlencode "accion=notificar_automatico" \
              --data-urlencode "secreto=${NOTIFICACIONES_SECRET}" \
              --data-urlencode "categoria=${categoria}" \
              --data-urlencode "archivo=${archivo}" \
              --data-urlencode "evento=${evento}" \
              "${APPS_SCRIPT_URL}"

            echo
            enviados=$((enviados + 1))
          done < /tmp/archivos_nuevos.txt

          echo "Solicitudes automáticas enviadas: ${enviados}"

      - name: Notificar Avisos importantes programados que comienzan hoy
        if: github.event_name == 'schedule'
        shell: bash
        env:
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxrR_Gbk40Kn2Q2Kmg7Si9CZs184bVJ9bzMqCugiS8McOCA21bp3GXR0aJR4JTNMYWIWg/exec"
          NOTIFICACIONES_SECRET: ${{ secrets.NOTIFICACIONES_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${NOTIFICACIONES_SECRET:-}" ]; then
            echo "ERROR: falta el Secret NOTIFICACIONES_SECRET en GitHub."
            exit 1
          fi

          hoy=$(TZ=America/Santiago date +%F)
          encontrados=0
          shopt -s nullglob nocasematch

          for archivo in avisos/*; do
            [ -f "$archivo" ] || continue

            if [[ "$archivo" =~ ^avisos/aviso[[:space:]]*[0-9]+_desde_${hoy}(_hasta_[0-9]{4}-[0-9]{2}-[0-9]{2})?\.(pdf|png|jpg|jpeg)$ ]]; then
              evento="archivo:${archivo}"
              echo "Activando notificación programada: $archivo"

              curl --fail --silent --show-error --location \
                --request POST \
                --data-urlencode "accion=notificar_automatico" \
                --data-urlencode "secreto=${NOTIFICACIONES_SECRET}" \
                --data-urlencode "categoria=Avisos importantes" \
                --data-urlencode "archivo=${archivo}" \
                --data-urlencode "evento=${evento}" \
                "${APPS_SCRIPT_URL}"

              echo
              encontrados=$((encontrados + 1))
            fi
          done

          echo "Avisos programados enviados hoy: ${encontrados}"
