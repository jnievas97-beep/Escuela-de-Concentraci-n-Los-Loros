name: Publicar sitio, comunicados, noticias y avisos

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar soporte para vistas previas PDF
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generar listas automáticas de comunicados, noticias y avisos
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          def fecha_git(archivo):
              try:
                  resultado = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cI",
                          "--",
                          str(archivo)
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

                  return resultado.stdout.strip()

              except Exception:
                  return ""


          # ===============================================
          # COMUNICADOS
          # ===============================================

          carpeta_comunicados = Path("comunicados")
          carpeta_comunicados.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_comunicado = re.compile(
              r"^COMUNICADO\s+(\d+)\.pdf$",
              re.IGNORECASE
          )

          comunicados = []

          for archivo in carpeta_comunicados.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_comunicado.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              comunicados.append({
                  "numero": numero,
                  "nombre": archivo.name,
                  "ruta": (
                      "comunicados/" +
                      quote(
                          archivo.name,
                          safe=""
                      )
                  ),
                  "fecha": fecha_git(
                      archivo
                  )
              })

          comunicados.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          salida_comunicados = (
              carpeta_comunicados /
              "comunicados.json"
          )

          salida_comunicados.write_text(
              json.dumps(
                  comunicados,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ===============================================
          # NOTICIAS
          #
          # Formatos:
          # noticias01.jpg
          # noticias02.jpeg
          # noticias03.png
          # noticias04.pdf
          # ===============================================

          carpeta_noticias = Path("noticias")
          carpeta_noticias.mkdir(
              parents=True,
              exist_ok=True
          )

          carpeta_previews = (
              carpeta_noticias /
              "previews"
          )

          if carpeta_previews.exists():
              shutil.rmtree(
                  carpeta_previews
              )

          carpeta_previews.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_noticia = re.compile(
              r"^noticias(\d+)\.(pdf|png|jpe?g)$",
              re.IGNORECASE
          )

          noticias = []

          for archivo in carpeta_noticias.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_noticia.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              extension = (
                  coincidencia.group(2)
                  .lower()
              )

              ruta_original = (
                  "noticias/" +
                  quote(
                      archivo.name,
                      safe=""
                  )
              )

              if extension == "pdf":

                  destino_pdf = (
                      carpeta_previews /
                      f"noticias{numero:02d}"
                  )

                  destino_pdf.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  prefijo = (
                      destino_pdf /
                      "pagina"
                  )

                  subprocess.run(
                      [
                          "pdftoppm",
                          "-png",
                          "-r",
                          "140",
                          str(archivo),
                          str(prefijo)
                      ],
                      check=True
                  )

                  paginas_locales = sorted(
                      destino_pdf.glob(
                          "pagina-*.png"
                      )
                  )

                  paginas = [
                      (
                          "noticias/previews/" +
                          f"noticias{numero:02d}/" +
                          pagina.name
                      )
                      for pagina in paginas_locales
                  ]

                  noticias.append({
                      "numero": numero,
                      "nombre": archivo.name,
                      "tipo": "pdf",
                      "ruta": ruta_original,
                      "paginas": paginas,
                      "fecha": fecha_git(
                          archivo
                      )
                  })

              else:

                  noticias.append({
                      "numero": numero,
                      "nombre": archivo.name,
                      "tipo": "imagen",
                      "ruta": ruta_original,
                      "paginas": [],
                      "fecha": fecha_git(
                          archivo
                      )
                  })

          noticias.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          salida_noticias = (
              carpeta_noticias /
              "noticias.json"
          )

          salida_noticias.write_text(
              json.dumps(
                  noticias,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # ===============================================
          # AVISOS IMPORTANTES
          #
          # Formatos admitidos:
          # aviso01.txt
          # aviso02.png
          # aviso03.jpg
          # aviso04.jpeg
          # aviso05.pdf
          #
          # Se muestra automáticamente el número más alto.
          # Si la carpeta está vacía, no aparece ninguna
          # sección de aviso en la página.
          # ===============================================

          carpeta_avisos = Path("avisos")
          carpeta_avisos.mkdir(
              parents=True,
              exist_ok=True
          )

          carpeta_previews_avisos = (
              carpeta_avisos /
              "previews"
          )

          if carpeta_previews_avisos.exists():
              shutil.rmtree(
                  carpeta_previews_avisos
              )

          carpeta_previews_avisos.mkdir(
              parents=True,
              exist_ok=True
          )

          patron_aviso = re.compile(
              r"^aviso(\d+)\.(txt|pdf|png|jpe?g)$",
              re.IGNORECASE
          )

          avisos = []

          for archivo in carpeta_avisos.iterdir():

              if not archivo.is_file():
                  continue

              coincidencia = patron_aviso.fullmatch(
                  archivo.name
              )

              if not coincidencia:
                  continue

              numero = int(
                  coincidencia.group(1)
              )

              extension = (
                  coincidencia.group(2)
                  .lower()
              )

              ruta_original = (
                  "avisos/" +
                  quote(
                      archivo.name,
                      safe=""
                  )
              )

              aviso = {
                  "numero": numero,
                  "nombre": archivo.name,
                  "ruta": ruta_original,
                  "fecha": fecha_git(
                      archivo
                  ),
                  "titulo": (
                      "Aviso importante N.º " +
                      str(numero)
                  ),
                  "texto": "",
                  "preview": ""
              }

              if extension == "txt":

                  aviso["tipo"] = "texto"

                  contenido_txt = (
                      archivo.read_text(
                          encoding="utf-8"
                      )
                      .strip()
                  )

                  lineas = [
                      linea.strip()
                      for linea in
                      contenido_txt.splitlines()
                      if linea.strip()
                  ]

                  if lineas:
                      aviso["titulo"] = lineas[0]

                  if len(lineas) > 1:
                      aviso["texto"] = "\n".join(
                          lineas[1:]
                      )

              elif extension == "pdf":

                  aviso["tipo"] = "pdf"

                  destino_preview = (
                      carpeta_previews_avisos /
                      f"aviso{numero:02d}"
                  )

                  destino_preview.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  prefijo = (
                      destino_preview /
                      "pagina"
                  )

                  subprocess.run(
                      [
                          "pdftoppm",
                          "-f",
                          "1",
                          "-singlefile",
                          "-png",
                          "-r",
                          "140",
                          str(archivo),
                          str(prefijo)
                      ],
                      check=True
                  )

                  preview_local = (
                      destino_preview /
                      "pagina.png"
                  )

                  if preview_local.exists():
                      aviso["preview"] = (
                          "avisos/previews/" +
                          f"aviso{numero:02d}/" +
                          "pagina.png"
                      )

              else:

                  aviso["tipo"] = "imagen"

              avisos.append(
                  aviso
              )

          avisos.sort(
              key=lambda item: item["numero"],
              reverse=True
          )

          salida_avisos = (
              carpeta_avisos /
              "avisos.json"
          )

          salida_avisos.write_text(
              json.dumps(
                  avisos,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          print(
              "Comunicados encontrados:",
              len(comunicados)
          )

          print(
              "Noticias encontradas:",
              len(noticias)
          )

          print(
              "Avisos importantes encontrados:",
              len(avisos)
          )

          if noticias:
              print(
                  "Última noticia:",
                  noticias[0]["nombre"]
              )
          else:
              print(
                  "Aún no hay noticias disponibles."
              )
          PY

      - name: Mostrar archivos generados
        shell: bash
        run: |
          echo "===== COMUNICADOS ====="
          cat comunicados/comunicados.json
          echo
          echo "===== NOTICIAS ====="
          cat noticias/noticias.json
          echo
          echo "===== AVISOS IMPORTANTES ====="
          cat avisos/avisos.json
          echo
          echo "===== VISTAS PREVIAS DE PDF ====="
          find noticias/previews -type f -maxdepth 3 -print || true
          echo
          echo "===== VISTAS PREVIAS DE AVISOS PDF ====="
          find avisos/previews -type f -maxdepth 3 -print || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
