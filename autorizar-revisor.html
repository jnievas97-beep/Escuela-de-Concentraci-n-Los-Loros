<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#1f5f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escuela Los Loros">
<link rel="manifest" href="manifest-revisor.json?v=20260910-10">
<link rel="apple-touch-icon" href="icono192.png">
<title>Autorización privada · Escuela Los Loros</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f5;margin:0;color:#17211b}
main{max-width:520px;margin:35px auto;padding:22px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}
h1{font-size:1.35rem;margin-top:0} label{display:block;margin:16px 0 6px;font-weight:700}
select,input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #bbb;font-size:1rem}
button{margin-top:20px;border:0;background:#1f5f3b;color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.55} #estado{margin-top:16px;line-height:1.45}
.aviso{font-size:.9rem;color:#536158}
</style>
</head>
<body>
<main><div class="card">
<h1>Autorización privada de dispositivo</h1>
<p>Uso exclusivo de funcionarias autorizadas para recibir avisos de nuevas justificaciones de inasistencia.</p>
<label for="revisor">Funcionaria</label>
<select id="revisor">
<option value="">Seleccione…</option>
<option value="tania">Tania Pizarro</option>
<option value="constanza">Constanza Vargas V.</option>
<option value="romina">Romina Carrizo</option>
</select>
<label for="clave">Clave privada</label>
<input id="clave" type="password" autocomplete="off" placeholder="Ingrese la clave entregada">
<button id="autorizar">Autorizar este teléfono</button>
<div id="estado" aria-live="polite"></div>
<p class="aviso">Esta página no aparece en los menús del sitio. La autorización se realiza una sola vez por teléfono, salvo cambio de dispositivo o pérdida del token.</p>
</div></main>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging-compat.js"></script>
<script>
(function(){
"use strict";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxrR_Gbk40Kn2Q2Kmg7Si9CZs184bVJ9bzMqCugiS8McOCA21bp3GXR0aJR4JTNMYWIWg/exec";
const VAPID = "BGdd3M34jY-u5u9zf3Nq19o8NCCldRCEoMi7gitbea-_aUTel-nslISWJ4hqcIRzAaQDbYlEnfefaQSyxVdDsC8";
const CONFIG = {
 apiKey:"AIzaSyCeurKQXNecTg3panlLFRUXbkLli1FPwZ8",
 authDomain:"escuela-los-loros.firebaseapp.com",
 projectId:"escuela-los-loros",
 storageBucket:"escuela-los-loros.firebasestorage.app",
 messagingSenderId:"946353006014",
 appId:"1:946353006014:web:3e5d5523a171cd33ba85ef",
 measurementId:"G-4RDL3QZBWN"
};
const estado=document.getElementById("estado");
const boton=document.getElementById("autorizar");

function decir(t,m){estado.textContent=m;estado.dataset.tipo=t;}

boton.addEventListener("click", async function(){
 const revisor=document.getElementById("revisor").value;
 const clave=document.getElementById("clave").value.trim();
 if(!revisor) return decir("error","Seleccione la funcionaria.");
 if(!clave) return decir("error","Ingrese la clave privada.");
 if(!("serviceWorker" in navigator) || !("Notification" in window))
   return decir("error","Este navegador no admite notificaciones web.");

 boton.disabled=true;
 decir("proceso","Solicitando autorización de notificaciones…");

 try{
   if(Notification.permission!=="granted"){
     const permiso=await Notification.requestPermission();
     if(permiso!=="granted") throw new Error("No se concedió permiso para notificaciones.");
   }

   if(!firebase.apps.length) firebase.initializeApp(CONFIG);
   const reg=await navigator.serviceWorker.register("sw.js?v=20260910-10");
   await navigator.serviceWorker.ready;
   const token=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
   if(!token) throw new Error("No fue posible obtener el token del teléfono.");

   const cuerpo=new URLSearchParams();
   cuerpo.set("accion","registrar_revisor_privado");
   cuerpo.set("clave",clave);
   cuerpo.set("revisor",revisor);
   cuerpo.set("token",token);
   cuerpo.set("plataforma",navigator.userAgent.slice(0,220));
   cuerpo.set("origen",location.origin+location.pathname);

   // no-cors permite enviar desde GitHub Pages al Web App sin exponer datos del formulario.
   await fetch(ENDPOINT,{
     method:"POST",
     mode:"no-cors",
     headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
     body:cuerpo.toString()
   });

   localStorage.setItem("escuelaLosLorosRevisorPrivado",revisor);
   localStorage.setItem("escuelaLosLorosClavePrivada",clave);
   localStorage.setItem("escuelaLosLorosTokenPrivado",token);
   localStorage.setItem("escuelaLosLorosUltimaSincPrivada",String(Date.now()));
   const esStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    const sufijo = token.slice(-8);
    decir("ok","Teléfono autorizado correctamente. Modo app: "+(esStandalone?"Sí":"No")+" · Token …"+sufijo+". El token privado quedará preparado para resincronizarse automáticamente.");
 }catch(e){
   console.error(e);
   decir("error","No fue posible autorizar este teléfono: "+(e.message||e));
 }finally{
   boton.disabled=false;
 }
});

let sincronizandoPrivado=false;
let ultimaSincSesion=0;
const MIN_SINC_SESION=60000;

async function resincronizarPrivadoSilencioso(){
  const ahora=Date.now();
  if(sincronizandoPrivado || (ahora-ultimaSincSesion)<MIN_SINC_SESION) return;
  const revisor=localStorage.getItem("escuelaLosLorosRevisorPrivado")||"";
  const clave=localStorage.getItem("escuelaLosLorosClavePrivada")||"";
  if(!revisor || !clave || Notification.permission!=="granted") return;
  if(!("serviceWorker" in navigator)) return;
  sincronizandoPrivado=true; ultimaSincSesion=ahora;
  try{
    if(!firebase.apps.length) firebase.initializeApp(CONFIG);
    const reg=await navigator.serviceWorker.register("sw.js?v=20260910-10");
    await navigator.serviceWorker.ready;
    const token=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
    if(!token) return;
    const cuerpo=new URLSearchParams();
    cuerpo.set("accion","registrar_revisor_privado");
    cuerpo.set("clave",clave); cuerpo.set("revisor",revisor); cuerpo.set("token",token);
    cuerpo.set("plataforma",navigator.userAgent.slice(0,220));
    cuerpo.set("origen",location.origin+location.pathname);
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:cuerpo.toString()});
    localStorage.setItem("escuelaLosLorosTokenPrivado",token);
    localStorage.setItem("escuelaLosLorosUltimaSincPrivada",String(Date.now()));
  }catch(e){console.warn("Resincronización privada pendiente:",e);}
  finally{sincronizandoPrivado=false;}
}
document.addEventListener("DOMContentLoaded",resincronizarPrivadoSilencioso);
window.addEventListener("pageshow",resincronizarPrivadoSilencioso);
window.addEventListener("focus",resincronizarPrivadoSilencioso);
window.addEventListener("online",resincronizarPrivadoSilencioso);
document.addEventListener("visibilitychange",function(){
 if(document.visibilityState==="visible") resincronizarPrivadoSilencioso();
});

})();
</script>
</body>
</html>
